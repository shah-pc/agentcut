[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcut"
version = "1.0.1"
description = "Deterministic, headless FFmpeg video editor designed for AI agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "AgentCut Contributors" }
]
keywords = ["video-editor", "ffmpeg", "ai-agents", "mcp", "headless", "capcut"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
dev = ["pytest>=7.0.0"]

[project.scripts]
agentcut = "agentcut.cli:main"
agentcut-mcp = "agentcut.mcp_server:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["agentcut*"]

[tool.setuptools.package-data]
agentcut = ["templates/*.json"]
